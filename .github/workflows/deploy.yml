name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install MDD CLI
        run: cargo install mdd_api

      - name: Prepare MDD and MIL data
        working-directory: db/data
        run: |
          curl -L -o MDD.zip https://github.com/mammaldiversity/mammaldiversity.github.io/raw/master/assets/data/MDD.zip

          MIL_URL=$(curl -s https://api.github.com/repos/mammaldiversity/asm-mil/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*\.tar\.gz"' \
            | grep -o 'https://[^"]*')
          MIL_FILENAME=$(basename "$MIL_URL")
          MIL_DIRNAME="${MIL_FILENAME%.tar.gz}"
          echo "MIL_DIRNAME=$MIL_DIRNAME" >> $GITHUB_ENV

          echo "Downloading MIL data from $MIL_URL"
          curl -L -o "$MIL_FILENAME" "$MIL_URL"

          # Parse MDD and merge the archive diff into the checked-in history.
          mdd unpack -i MDD.zip -o . --append-diff diffs.json.gz

          # Prepare MIL metadata from the extracted MDD CSV.
          MDD_FILE=$(find MDD -type f -name 'MDD_v*.csv' -print -quit)
          if [ -z "$MDD_FILE" ]; then
            echo "ERROR: No MDD species CSV found after unpacking MDD.zip" >&2
            exit 1
          fi
          mdd mil -m "$MIL_FILENAME" -d "$MDD_FILE" -o mil.json

          # Extract images so they can be moved/verified downstream
          tar -xzf "$MIL_FILENAME"

      - name: Commit parsed MDD diffs
        working-directory: db/data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ./diffs.json.gz
          if git diff --cached --quiet; then
            echo "No parsed diff changes to commit."
            exit 0
          fi

          staged_files=$(git diff --cached --name-only)
          if [ "$staged_files" != "./diffs.json.gz" ]; then
            echo "ERROR: Unexpected files staged for the diff update:" >&2
            printf '%s\n' "$staged_files" >&2
            exit 1
          fi

          git commit -m "Update parsed release diffs"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Normalize region data
        run: bun run normalize-region-data

      - name: Copy MIL images to Astro assets
        working-directory: db/data
        run: |
          IMAGES_DIR="$MIL_DIRNAME/images-540px-webp"
          mkdir -p ../../public/mil-images
          find "$IMAGES_DIR" -name "*.webp" -exec mv {} ../../public/mil-images/ \;

      - name: Validate MIL images in assets
        run: |
          IMAGE_COUNT=$(find public/mil-images -name "*.webp" | wc -l)
          echo "Found $IMAGE_COUNT .webp files in public/mil-images"
          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "ERROR: No .webp images found in public/mil-images. Aborting."
            exit 1
          fi

      - name: Clean up data files
        working-directory: db/data
        run: rm MDD.zip

      - name: Build and upload Astro site
        uses: withastro/action@v4
        with:
          package-manager: bun

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
